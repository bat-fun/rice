source = ~/.cache/noir-signal/hyprlock-colors.conf

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = false
    grace = 2
    disable_loading_bar = true
    immediate_render = true
}

background {
    monitor =
    path = screenshot

    # Keep the wallpaper crisp.
    blur_passes = 3
    blur_size = 7

    noise = 0.008
    contrast = 1.06
    brightness = 0.67
    vibrancy = 0.22
}

# ============================================================
# GLASS CARD
# ============================================================

shape {
    monitor =

    size = 440, 430
    position = 0, 0

    halign = center
    valign = center

    color = rgba(09, 0A, 0C, B8)

    rounding = 22

    border_size = 1
    border_color = rgba(214, 168, 95, 75)

    rotate = 0
    xray = false
}

# ============================================================
# TOP ACCENT
# ============================================================

shape {
    monitor =

    size = 46, 3
    position = 0, 177

    halign = center
    valign = center

    color = $accent
    rounding = 2
}

# ============================================================
# DATE
# ============================================================

label {
    monitor =

    text = cmd[update:30000] echo "$(date '+%A')"

    font_family = $font
    font_size = 13
    font_weight = 600

    color = $secondary

    position = 0, 137
    halign = center
    valign = center
}

label {
    monitor =

    text = cmd[update:30000] echo "$(date '+%d  ·  %B  ·  %Y')"

    font_family = $font
    font_size = 10

    color = $muted

    position = 0, 113
    halign = center
    valign = center
}

# ============================================================
# CLOCK
# ============================================================

label {
    monitor =

    text = cmd[update:1000] echo "$(date '+%I:%M')"

    font_family = $font
    font_size = 76
    font_weight = 700

    color = $text

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 90)

    position = -12, 39
    halign = center
    valign = center
}

label {
    monitor =

    text = cmd[update:1000] echo "$(date '+%p')"

    font_family = $font
    font_size = 15
    font_weight = 700

    color = $accent

    position = 139, 49
    halign = center
    valign = center
}

# ============================================================
# USER
# ============================================================

label {
    monitor =

    text = "$USER"

    font_family = $font
    font_size = 11
    font_weight = 600

    color = $text

    position = 0, -35
    halign = center
    valign = center
}

# ============================================================
# PASSWORD FIELD
# ============================================================

input-field {
    monitor =

    size = 330, 58

    outline_thickness = 1
    rounding = 12

    outer_color = $accent
    inner_color = rgba(17, 19, 24, E0)

    font_family = $font
    font_size = 12
    font_color = $text

    fade_on_empty = false
    hide_input = false

    placeholder_text = <i>enter password</i>
    placeholder_color = $muted

    dots_center = true
    dots_size = 0.20
    dots_spacing = 0.22
    dots_rounding = 1
    dots_color = $accent

    check_color = $secondary
    fail_color = $danger

    fail_text = <i>access denied</i>

    position = 0, -95
    halign = center
    valign = center
}

# ============================================================
# FOOTER TEXT
# ============================================================

label {
    monitor =

    text = "GOOD THINGS TAKE TIME"

    font_family = $font
    font_size = 8
    font_weight = 500

    color = $muted

    position = 0, -151
    halign = center
    valign = center
}

# ============================================================
# BOTTOM ACCENT
# ============================================================

shape {
    monitor =

    size = 28, 2
    position = 0, -178

    halign = center
    valign = center

    color = $secondary
    rounding = 2
}