source = ~/.cache/noir-signal/hyprlock-colors.conf

# RICE LOCK SCREEN
# Wallpaper-led editorial layout with a quiet authentication dock.

general {
    hide_cursor = true
    ignore_empty_input = false
    grace = 2
    pam_module = hyprlock
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 5
    noise = 0.012
    contrast = 0.96
    brightness = 0.68
    vibrancy = 0.24
}

# Identity rail
label {
    monitor =
    text = "RICE  /  PRIVATE SESSION"
    color = $accent
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    font_weight = 600
    position = -330, 258
    halign = center
    valign = center
}

label {
    monitor =
    text = "WAYLAND  //  HYPRLAND"
    color = $muted
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    font_weight = 500
    position = -330, 228
    halign = center
    valign = center
}

# Time block
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = $text
    font_size = 104
    font_family = JetBrainsMono Nerd Font
    font_weight = 500
    position = -330, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A  /  %d %B %Y')"
    color = $secondary
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    font_weight = 500
    position = -330, -8
    halign = center
    valign = center
}

label {
    monitor =
    text = "SESSION LOCKED"
    color = $muted
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    font_weight = 500
    position = -330, -38
    halign = center
    valign = center
}

# Authentication dock
label {
    monitor =
    text = $USER
    color = $accent
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    font_weight = 600
    position = 330, -120
    halign = right
    valign = bottom
}

input-field {
    monitor =
    size = 360, 62
    outline_thickness = 2
    inner_color = $surface
    outer_color = $accent
    font_color = $text
    fade_on_empty = false
    hide_input = false
    placeholder_text = <i>Enter password</i>
    placeholder_color = $muted
    dots_center = true
    dots_size = 0.20
    dots_spacing = 0.20
    dots_color = $accent
    check_color = $secondary
    fail_color = $danger
    fail_text = <i>Authentication failed</i>
    position = 330, -46
    halign = right
    valign = bottom
}

label {
    monitor =
    text = "ESC  CANCEL   //   ENTER  UNLOCK"
    color = $muted
    font_size = 9
    font_family = JetBrainsMono Nerd Font
    font_weight = 500
    position = 330, 28
    halign = right
    valign = bottom
}
