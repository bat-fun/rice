# Generated by Matugen. Complete Dunst configuration.

[global]
    monitor = 0
    follow = mouse
    origin = top-center
    offset = (0, 48)
    width = 420
    height = 300
    notification_limit = 5
    progress_bar = true
    progress_bar_height = 3
    progress_bar_frame_width = 0
    progress_bar_min_width = 180
    progress_bar_max_width = 420
    indicate_hidden = yes
    transparency = 4
    separator_height = 1
    padding = 14
    horizontal_padding = 16
    text_icon_padding = 10
    frame_width = 1
    separator_color = frame
    corner_radius = 4
    sort = urgency_descending
    idle_threshold = 120
    font = JetBrainsMono Nerd Font 10.5
    line_height = 0
    markup = full
    format = "<b>%s</b>  %b"
    stack_duplicates = true
    hide_duplicate_count = true
    show_indicators = yes
    icon_position = left
    min_icon_size = 32
    max_icon_size = 48
    icon_theme = Adwaita
    enable_recursive_icon_lookup = true
    mouse_left_click = close_current
    mouse_middle_click = do_action
    mouse_right_click = close_all

[urgency_low]
    background = "{{colors.surface_container_lowest.dark.hex}}"
    foreground = "{{colors.on_surface_variant.dark.hex}}"
    frame_color = "{{colors.secondary.dark.hex}}"
    timeout = 4

[urgency_normal]
    background = "{{colors.surface_container_high.dark.hex}}"
    foreground = "{{colors.on_background.dark.hex}}"
    frame_color = "{{colors.primary.dark.hex}}"
    timeout = 6

[urgency_critical]
    background = "{{colors.error_container.dark.hex}}"
    foreground = "{{colors.on_error_container.dark.hex}}"
    frame_color = "{{colors.error.dark.hex}}"
    timeout = 0
